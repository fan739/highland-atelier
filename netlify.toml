[build]
  publish = "."
  command = ""

# Content Security Policy.
# All scripts live in main.js (no inline <script>), so script-src only needs 'self'.
# Leaving out 'unsafe-inline' in script-src also stops the "Powered by Netlify" badge
# from rendering, as described in Netlify's docs.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'"
